[build]
builder = "NIXPACKS"

[deploy]
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[[services]]
name = "backend"
rootDirectory = "backend"
startCommand = "npm start"

[[services]]
name = "ai-service"
rootDirectory = "ai-service"
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
